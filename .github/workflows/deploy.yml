name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild (~3-4 AM Pacific) so past pop-ups drop off and the
  # Kickstarter block flips after the deadline.
  schedule:
    - cron: '0 11 * * *'
    # One-off: rebuild right after the Kickstarter closes
    # (Mon Nov 16 2026, 10:13 PM PST = 06:13 UTC Nov 17) so it stops asking for pledges.
    - cron: '20 6 17 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v6
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
